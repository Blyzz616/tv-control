# TV remote (Seeed XIAO ESP32-C6 + 2x M5Stack U025 Dual Button + M5Stack U186 Unit Scroll)
#
# Caps:   1 YouTube | 2 Jellyfin | [scroll] | 3 Netflix | 4 Prime Video
# Scroll: turn = TV volume, press = TV power toggle
#
# U025 signal: VCC -10K- node -20K- GND, switch shorts node to GND.
# Idle ~3.33V (HIGH), pressed 0V (LOW). No internal pull-up.
# Button pins copied from the bedroom quad-button.yaml. Check which physical cap
# lands on which pin after assembly and swap the app names below if needed.
#
# U186 on I2C: SDA = D4 (GPIO22), SCL = D5 (GPIO23), 5V + GND from the XIAO 5V pin (USB powered).
# CHECK: D4/D5 -> GPIO22/23 is from the XIAO ESP32-C6 pinout as I know it, not re-verified.
#
# All TV logic lives in Chaos (homeassistant/scripts.yaml): this device only calls
# script.tv_launch_app, script.tv_power_toggle and script.tv_volume_step.

substitutions:
  device_name: tv-control
  friendly_name: TV Control

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

wifi:
  ssid: "Longboat"
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [unit_scroll]
    refresh: 1d

i2c:
  id: bus_a
  sda: GPIO22
  scl: GPIO23
  scan: true

unit_scroll:
  id: scroll
  i2c_id: bus_a
  address: 0x40
  # LED off (not used)
  rgb_red: 0
  rgb_green: 0
  rgb_blue: 0

globals:
  - id: last_count
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: count_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pending_steps
    type: int
    restore_value: no
    initial_value: '0'

binary_sensor:
  - platform: gpio
    name: "Button 1"
    id: btn_1
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on_off: 25ms
    on_press:
      - homeassistant.action:
          action: script.tv_launch_app
          data:
            app: YouTube

  - platform: gpio
    name: "Button 2"
    id: btn_2
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on_off: 25ms
    on_press:
      - homeassistant.action:
          action: script.tv_launch_app
          data:
            app: Jellyfin

  - platform: gpio
    name: "Button 3"
    id: btn_3
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on_off: 25ms
    on_press:
      - homeassistant.action:
          action: script.tv_launch_app
          data:
            app: Netflix

  - platform: gpio
    name: "Button 4"
    id: btn_4
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on_off: 25ms
    on_press:
      - homeassistant.action:
          action: script.tv_launch_app
          data:
            app: Prime Video

  # Scroll wheel press. CHECK: polarity. M5's driver returns (register != 0);
  # if this reads "on" while idle, add `- invert:` to the filters.
  - platform: template
    name: "Scroll Button"
    id: scroll_btn
    lambda: 'return id(scroll).get_button_state();'
    filters:
      - delayed_on_off: 30ms
    on_press:
      - homeassistant.action:
          action: script.tv_power_toggle

interval:
  # Poll the wheel. The counter is a free-running uint16; the signed difference
  # handles wrap-around. Detents are queued and sent one HA call at a time.
  - interval: 50ms
    then:
      - lambda: |-
          uint16_t now = id(scroll).get_value();
          if (!id(count_ready)) { id(last_count) = now; id(count_ready) = true; return; }
          int16_t d = (int16_t) (uint16_t) (now - id(last_count));
          id(last_count) = now;
          int p = id(pending_steps) + d;
          if (p > 10) p = 10;
          if (p < -10) p = -10;
          id(pending_steps) = p;
  - interval: 120ms
    then:
      - if:
          condition:
            lambda: 'return id(pending_steps) != 0;'
          then:
            - homeassistant.action:
                action: script.tv_volume_step
                data:
                  direction: !lambda 'return id(pending_steps) > 0 ? "up" : "down";'
            - lambda: 'id(pending_steps) += (id(pending_steps) > 0) ? -1 : 1;'

sensor:
  - platform: unit_scroll
    unit_scroll_id: scroll
    name: "Scroll Count"
    update_interval: 10s
    entity_category: diagnostic
